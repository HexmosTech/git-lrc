  <rect x="0" y="0" width="1327" height="330" fill="#ffffff"/>
  <rect x="0" y="0" width="1327" height="330" fill="url(#glow)"/>

  <!-- Line 1 -->
  <text x="0" y="66" class="bold" font-size="54">
    <tspan fill="#dc2626">Blast-Radius Aware</tspan><tspan fill="#0f172a"> AI Code Review</tspan>
  </text>
  <rect x="0" y="78" width="459" height="3" fill="#f87171"/>


<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="6%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="97%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#1d56f0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1d56f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d56f0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="360" rx="20"/>
    </clipPath>
    <style>
      .bold { font-family: 'Liberation Sans', Arial, sans-serif; font-weight: 700; }
      .reg  { font-family: 'Liberation Sans', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="360" fill="url(#redGlow)"/>
    <rect x="0" y="0" width="1200" height="360" fill="url(#blueGlow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Tagline: the sell, front and center -->
  <g transform="translate(56,40)">
    <text x="0" y="56" class="bold" font-size="54">
      <tspan fill="#ef4444">Blast-Radius Aware</tspan><tspan fill="#f8fafc"> AI Code Review</tspan>
    </text>
    <rect x="0" y="68" width="459" height="3" fill="#f87171"/>

    <text x="0" y="130" class="bold" font-size="54">
      <tspan fill="#f8fafc">for </tspan><tspan fill="#5b8cfb">Business-Critical Systems</tspan><tspan fill="#f8fafc">.</tspan>
    </text>
    <rect x="98" y="142" width="623" height="3" fill="#5b8cfb" opacity="0.85"/>
  </g>

  <!-- Product identity -->
  <g transform="translate(56,264)">
    <g transform="translate(30,30)">
      <circle cx="0" cy="0" r="30" fill="#1E429F" opacity="0.22"/>
      <circle cx="0" cy="0" r="25" fill="#111827"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="12.5" fill="#60A5FA"/>
      <circle cx="0" cy="0" r="6.25" fill="#1E40AF"/>
      <circle cx="-4.4" cy="-4.7" r="3" fill="#ffffff" opacity="0.85"/>
    </g>
    <text x="76" y="40" class="bold" font-size="32">
      <tspan fill="#f8fafc">Live</tspan><tspan fill="#3b82f6">Review</tspan>
    </text>
  </g>

  <!-- CTA -->
  <g transform="translate(896,270)">
    <rect x="0" y="0" width="248" height="56" rx="28" fill="url(#ctaGrad)"/>
    <text x="124" y="35" text-anchor="middle" class="bold" font-size="19" fill="#ffffff">Explore LiveReview</text>
    <path d="M 216 28 L 228 28 M 222 22 L 228 28 L 222 34" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1020" y="350" text-anchor="middle" class="reg" font-size="15" fill="#64748b">hexmos.com/livereview</text>
</svg>
